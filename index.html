<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://5gvci.com/act/files/tag.min.js?z=11444443" data-cfasync="false" async></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>5 CLUES — Case File Detective Engine</title>
<meta name="monetag" content="bfcd1488c4d5ddecd23ac595546e9803">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&family=Cinzel:wght@700;900&family=Orbitron:wght@700;900&family=Bangers&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-grad-start: #0B0E14;
    --bg-main: #0B0E14;
    --card-bg: #151922;
    --card-border: #232B3E;
    --text-main: #F1F5F9;
    --text-muted: #94A3B8;
    --primary-accent: #F59E0B;
    --secondary-accent: #06B6D4;
    --slot-bg: #1E293B;
    --theme-font: 'Plus Jakarta Sans', sans-serif;
    --theme-header-font: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease; }
  
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, var(--bg-grad-start) 0%, var(--bg-main) 80%);
    font-family: var(--theme-font);
    color: var(--text-main);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 16px; overflow-x: hidden;
  }

  .app { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }

  /* Top Bar */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .brand { font-family: var(--theme-header-font); font-size: 20px; font-weight: 800; color: var(--primary-accent); letter-spacing: -0.5px; }
  .stats-row { display: flex; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; }
  .badge { background: rgba(255,255,255,0.05); color: var(--primary-accent); border: 1px solid var(--card-border); padding: 4px 8px; border-radius: 6px; }

  /* Main Card */
  .case-card {
    position: relative; background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; gap: 16px; overflow: hidden;
  }

  .meta-bar { display: flex; justify-content: space-between; align-items: center; font-family: var(--theme-header-font); font-size: 11px; color: var(--text-muted); }
  .meta-tag { background: rgba(255,255,255,0.06); color: var(--secondary-accent); border: 1px solid var(--card-border); padding: 4px 10px; border-radius: 6px; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }

  /* Clue Display */
  .clue-box {
    background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px;
    min-height: 95px; display: flex; flex-direction: column; justify-content: center; position: relative;
  }
  .clue-num { font-family: var(--theme-header-font); font-size: 11px; color: var(--primary-accent); text-transform: uppercase; margin-bottom: 6px; font-weight: 800; }
  .clue-text { font-size: 15px; line-height: 1.45; font-weight: 500; color: var(--text-main); }

  /* Word Mask Display */
  .word-slots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 6px 0; }
  .slot {
    width: 32px; height: 40px; background: var(--slot-bg); border: 2px solid var(--card-border);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-family: var(--theme-header-font); font-size: 18px; font-weight: 800; color: var(--primary-accent);
    text-transform: uppercase;
  }
  .slot.filled { border-color: var(--primary-accent); background: rgba(255,255,255,0.05); box-shadow: 0 0 10px rgba(255,255,255,0.1); }

  /* Action Buttons */
  .input-group { display: flex; gap: 8px; }
  .guess-input {
    flex: 1; background: rgba(0,0,0,0.4); border: 2px solid var(--card-border); border-radius: 10px;
    padding: 12px 14px; font-size: 16px; color: var(--text-main); font-weight: 600; outline: none;
    font-family: var(--theme-font);
  }
  .guess-input:focus { border-color: var(--secondary-accent); }
  .btn {
    background: var(--primary-accent); color: #000; font-weight: 800; font-size: 14px;
    border: none; border-radius: 10px; padding: 0 18px; cursor: pointer; transition: transform 0.1s;
    display: flex; align-items: center; justify-content: center; font-family: var(--theme-header-font);
  }
  .btn:active { transform: scale(0.96); }
  .btn-ad {
    background: var(--card-bg); color: var(--secondary-accent); border: 1px solid var(--card-border);
    width: 100%; padding: 12px; font-size: 12px; font-family: var(--theme-header-font); gap: 8px; border-radius: 10px; font-weight: 700;
    cursor: pointer; text-decoration: none; text-align: center; display: inline-block;
  }

  /* History list */
  .history-list { display: flex; flex-direction: column; gap: 6px; }
  .history-item { font-size: 12px; padding: 8px 10px; background: rgba(255,255,255,0.02); border-left: 3px solid var(--primary-accent); border-radius: 4px; color: var(--text-muted); }

  /* Stamp overlay */
  .stamp {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0) rotate(-10deg);
    font-family: var(--theme-header-font); font-size: 32px; font-weight: 800; padding: 10px 24px;
    border: 4px solid currentColor; border-radius: 12px; pointer-events: none; opacity: 0; z-index: 10;
  }
  .stamp.show { animation: stampPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
  .stamp.wrong { color: #EF4444; background: rgba(15, 23, 42, 0.95); }
  .stamp.solved { color: var(--primary-accent); background: rgba(15, 23, 42, 0.95); }

  @keyframes stampPop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2) rotate(-10deg); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-10deg); } }

  /* Results Screen */
  .results { display: none; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
  .results.active { display: flex; }
  .res-title { font-size: 24px; font-weight: 800; color: var(--primary-accent); font-family: var(--theme-header-font); }
  .res-grid { font-size: 24px; letter-spacing: 4px; background: rgba(0,0,0,0.3); padding: 12px 20px; border-radius: 10px; border: 1px solid var(--card-border); }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="brand">5 CLUES</div>
    <div class="stats-row">
      <div class="badge" id="streakBadge">🔥 1 STREAK</div>
      <div class="badge" id="scoreBadge">⭐ 0 PTS</div>
    </div>
  </div>

  <div class="case-card">
    <div class="stamp" id="stamp">WRONG</div>

    <div class="meta-bar">
      <span class="meta-tag" id="categoryTag">GENERATING...</span>
      <span id="caseNo">CASE #1001</span>
    </div>

    <div id="playArea" style="display:flex; flex-direction:column; gap:14px;">
      <div class="clue-box">
        <div class="clue-num" id="clueNum">CLUE 1 OF 5 (100 PTS)</div>
        <div class="clue-text" id="clueText">Synthesizing case file details...</div>
      </div>

      <div class="word-slots" id="wordSlots"></div>

      <div class="input-group">
        <input type="text" class="guess-input" id="guessInput" placeholder="Type answer..." autocomplete="off">
        <button class="btn" id="guessBtn">GUESS</button>
      </div>

      <button class="btn btn-ad" id="adBtn">
        💡 WATCH AD / GET EXTRA HINT (+LETTER)
      </button>

      <div class="history-list" id="historyList"></div>
    </div>

    <div class="results" id="results">
      <div class="res-title" id="resTitle">CASE SOLVED!</div>
      <p style="color:var(--text-muted); font-size:14px;" id="resSub">You scored 80 points.</p>
      <div class="res-grid" id="resGrid">🟩⬜⬜⬜⬜</div>
      <button class="btn" id="shareBtn" style="width:100%; padding:14px;">📋 SHARE CASE RESULT</button>
      <button class="btn" id="nextCaseBtn" style="width:100%; padding:14px; background:var(--secondary-accent); color:#000;">⚡ NEXT CASE FILE</button>
    </div>
  </div>
</div>

<script>
// Web Audio Synth
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'correct') {
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'wrong') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
  }
}

// Procedural Theme Styling Engine
function generateThemeCSS(category) {
  let hash = 0;
  for (let i = 0; i < category.length; i++) hash = category.charCodeAt(i) + ((hash << 5) - hash);
  const hue1 = Math.abs(hash) % 360;
  const hue2 = (hue1 + 140) % 360;
  const fonts = ['Plus Jakarta Sans', 'Orbitron', 'Cinzel', 'Bangers', 'JetBrains Mono'];
  const fontChoice = fonts[Math.abs(hash) % fonts.length];

  return {
    bgStart: `hsl(${hue1}, 70%, 12%)`,
    bgMain: `hsl(${hue1}, 80%, 4%)`,
    cardBg: `hsl(${hue1}, 50%, 8%)`,
    cardBorder: `hsl(${hue1}, 40%, 18%)`,
    primaryAccent: `hsl(${hue1}, 90%, 55%)`,
    secondaryAccent: `hsl(${hue2}, 90%, 60%)`,
    slotBg: `hsl(${hue1}, 40%, 14%)`,
    font: fontChoice
  };
}

function applyProceduralTheme(category) {
  const t = generateThemeCSS(category);
  const root = document.documentElement;
  root.style.setProperty('--bg-grad-start', t.bgStart);
  root.style.setProperty('--bg-main', t.bgMain);
  root.style.setProperty('--card-bg', t.cardBg);
  root.style.setProperty('--card-border', t.cardBorder);
  root.style.setProperty('--primary-accent', t.primaryAccent);
  root.style.setProperty('--secondary-accent', t.secondaryAccent);
  root.style.setProperty('--slot-bg', t.slotBg);
  root.style.setProperty('--theme-font', `'${t.font}', sans-serif`);
  root.style.setProperty('--theme-header-font', `'${t.font}', sans-serif`);
}

const SUBJECTS = [
  { name: "SCIENCE", target: "PENICILLIN", clues: ["I was discovered by accident in an uncovered petri dish.", "I belong to a family of mold-derived antibiotic compounds.", "Mass-produced during World War II to save millions of lives.", "Alexander Fleming discovered me in 1928.", "I am the world's first true antibiotic miracle drug."] },
  { name: "ASTRONOMY", target: "SUPERNOVA", clues: ["I am a monumental stellar explosion.", "I briefly outshine entire galaxies in brightness.", "I leave behind neutron stars or black holes.", "My shockwaves synthesize heavy elements like gold.", "The cataclysmic death of a massive star."] },
  { name: "GAMING", target: "MINECRAFT", clues: ["I was created by Markus 'Notch' Persson in 2009.", "I feature pixelated 3D blocky landscapes.", "Players battle Creepers, Endermen, and the Ender Dragon.", "I am the best-selling video game of all time.", "The iconic sandbox game of survival and building."] },
  { name: "GEOGRAPHY", target: "AMAZON", clues: ["I flow through nine South American countries.", "I hold more water volume than the next 7 largest rivers combined.", "I run through the world's largest tropical rainforest.", "Home to pink river dolphins and piranhas.", "The largest river by discharge volume in the world."] },
  { name: "ANIMATION", target: "PIXAR", clues: ["I pioneered the world's first computer-animated feature film in 1995.", "My mascot is a jumping desk lamp named Luxo Jr.", "Creator of Toy Story, Finding Nemo, and The Incredibles.", "Acquired by Disney in 2006.", "The famous animation studio based in Emeryville."] },
  { name: "TECHNOLOGY", target: "BITCOIN", clues: ["I was created in 2009 by a mysterious entity named Satoshi.", "I operate on a decentralized public ledger called a blockchain.", "My total supply is capped forever at 21 million units.", "People perform 'mining' with hardware to earn me.", "I am the world's first and largest cryptocurrency."] },
  { name: "HISTORY", target: "CLEOPATRA", clues: ["I was the last active ruler of the Ptolemaic Kingdom of Egypt.", "Famous for my strategic political alliances with Julius Caesar.", "I spoke multiple languages, including Egyptian and Greek.", "My life ended tragically in 30 BC via an asp bite legend.", "One of history's most iconic Egyptian queens."] },
  { name: "POP CULTURE", target: "AVATAR", clues: ["Released in 2009, I revolutionized 3D cinematic technology.", "Set on the lush alien moon world of Pandora.", "Features the Na'vi species and blue-skinned avatars.", "Directed by James Cameron and became highest-grossing film.", "A blockbuster movie saga about Pandora."] },
  { name: "PHYSICS", target: "GRAVITY", clues: ["I am one of the four fundamental forces of nature.", "Isaac Newton formulated my mathematical laws under an apple tree.", "Albert Einstein described me as the curvature of spacetime.", "I keep the planets orbiting around the sun.", "The force that attracts objects toward the Earth's center."] },
  { name: "LITERATURE", target: "SHAKESPEARE", clues: ["I wrote 38 plays and 154 sonnets in my lifetime.", "Born in Stratford-upon-Avon, England in 1564.", "Creator of Hamlet, Romeo & Juliet, and Macbeth.", "Often called the Bard of Avon.", "History's most famous English playwright and poet."] }
];

let remainingIndices = [];
let caseCount = 1000;
let currentCase = null;
let clueIdx = 0;
let revealedLetters = [];
let history = [];
let score = 0;
let streak = 1;

function getNextRandomIndex() {
  if (remainingIndices.length === 0) {
    remainingIndices = Array.from({length: SUBJECTS.length}, (_, i) => i);
    for (let i = remainingIndices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [remainingIndices[i], remainingIndices[j]] = [remainingIndices[j], remainingIndices[i]];
    }
  }
  return remainingIndices.pop();
}

function loadNextInfiniteCase() {
  caseCount++;
  const subjectIdx = getNextRandomIndex();
  currentCase = SUBJECTS[subjectIdx];
  clueIdx = 0;
  history = [];
  revealedLetters = Array(currentCase.target.length).fill(false);
  revealedLetters[0] = true;

  applyProceduralTheme(currentCase.name);

  document.getElementById('playArea').style.display = 'flex';
  document.getElementById('results').classList.remove('active');
  document.getElementById('categoryTag').textContent = currentCase.name;
  document.getElementById('caseNo').textContent = `CASE #${caseCount}`;
  renderState();
}

function renderState() {
  document.getElementById('clueNum').textContent = `CLUE ${clueIdx + 1} OF 5 (${(5 - clueIdx) * 20} PTS)`;
  document.getElementById('clueText').textContent = currentCase.clues[clueIdx];
  
  const slotsContainer = document.getElementById('wordSlots');
  slotsContainer.innerHTML = '';
  for (let i = 0; i < currentCase.target.length; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot' + (revealedLetters[i] ? ' filled' : '');
    slot.textContent = revealedLetters[i] ? currentCase.target[i] : '';
    slotsContainer.appendChild(slot);
  }

  document.getElementById('historyList').innerHTML = history.map(h => `<div class="history-item">❌ Guessed: "${h}"</div>`).join('');
}

function triggerStamp(text, isCorrect, cb) {
  const stamp = document.getElementById('stamp');
  stamp.textContent = text;
  stamp.className = `stamp show ${isCorrect ? 'solved' : 'wrong'}`;
  playSound(isCorrect ? 'correct' : 'wrong');
  setTimeout(() => {
    stamp.className = 'stamp';
    if (cb) cb();
  }, 700);
}

function handleGuess() {
  const input = document.getElementById('guessInput');
  const val = input.value.trim().toUpperCase();
  if (!val) return;

  // OPENS NEW DIRECT AD LINK ON GUESS CLICK
  window.open("https://omg10.com/4/11445748", "_blank");

  if (val === currentCase.target) {
    triggerStamp('SOLVED', true, () => finishGame(true));
  } else {
    triggerStamp('WRONG', false, () => {
      history.push(val);
      input.value = '';
      if (clueIdx < 4) {
        clueIdx++;
        const unrevealed = revealedLetters.map((r, i) => r ? -1 : i).filter(i => i !== -1);
        if (unrevealed.length > 0) revealedLetters[unrevealed[0]] = true;
        renderState();
      } else {
        finishGame(false);
      }
    });
  }
}

function handleWatchAdReveal() {
  // OPENS DIRECT AD LINK 1 FOR HINT
  window.open("https://omg10.com/4/1144828", "_blank");

  if (clueIdx < 4) {
    clueIdx++;
    const unrevealed = revealedLetters.map((r, i) => r ? -1 : i).filter(i => i !== -1);
    if (unrevealed.length > 0) revealedLetters[unrevealed[0]] = true;
    renderState();
  } else {
    const unrevealed = revealedLetters.map((r, i) => r ? -1 : i).filter(i => i !== -1);
    if (unrevealed.length > 0) {
      revealedLetters[unrevealed[0]] = true;
      renderState();
    }
  }
}

function finishGame(won) {
  document.getElementById('playArea').style.display = 'none';
  const res = document.getElementById('results');
  res.classList.add('active');
  const points = won ? (5 - clueIdx) * 20 : 0;
  if (won) {
    score += points;
    streak++;
    document.getElementById('resTitle').textContent = 'CASE SOLVED!';
    document.getElementById('resSub').textContent = `You unlocked the file on clue ${clueIdx + 1} and scored ${points} PTS.`;
  } else {
    streak = 1;
    document.getElementById('resTitle').textContent = 'CASE CLOSED';
    document.getElementById('resSub').textContent = `The target was ${currentCase.target}. Better luck on the next case!`;
  }
  document.getElementById('scoreBadge').textContent = `⭐ ${score} PTS`;
  document.getElementById('streakBadge').textContent = `🔥 ${streak} STREAK`;
}

document.getElementById('guessBtn').addEventListener('click', handleGuess);
document.getElementById('guessInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleGuess(); });
document.getElementById('adBtn').addEventListener('click', handleWatchAdReveal);
document.getElementById('nextCaseBtn').addEventListener('click', loadNextInfiniteCase);

document.getElementById('shareBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(`5 CLUES Case #${caseCount} 🟩\nScore: ${score} PTS\nPlay now: https://5cluesgame.netlify.app`);
  alert('Result copied to clipboard!');
});

loadNextInfiniteCase();
</script>
</body>
</html>
